<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="grovs-layout" content="banner_bottom">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
<title>Feedback</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FFFFFF;
    --text: #0F172A;
    --muted: #64748B;
    --face: #F1F5F9;
    --edge: #E2E8F0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F172A; --text: #F1F5F9; --muted: #94A3B8; --face: #1E293B; --edge: #1E293B; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    border-top: 1px solid var(--edge);
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  .question { margin: 0; padding-right: 40px; font-size: 16px; font-weight: 600; }
  .faces { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
  .face {
    appearance: none;
    flex: 1;
    max-width: 64px;
    aspect-ratio: 1;
    border: 2px solid transparent;
    border-radius: 18px;
    background: var(--face);
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .face:hover:not(:disabled) { transform: translateY(-2px); }
  .face:disabled { cursor: default; }
  .face:active { transform: scale(.94); }
  .face.picked {
    border-color: var(--brand);
    background: rgba(29, 111, 224, .12);
    background: color-mix(in srgb, var(--brand) 14%, var(--bg));
    transform: scale(1.06);
  }
  .scale { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 12px; }
  .thanks {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
    padding: 6px 40px 6px 0;
    font-size: 16px;
    font-weight: 600;
    animation: rise .3s ease both;
  }
  .tick { position: relative; flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--brand); }
  .tick::after {
    content: "";
    position: absolute;
    left: 12px;
    top: 7px;
    width: 6px;
    height: 13px;
    border: solid #FFFFFF;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .thanks { animation: none; }
  }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  /* A wide, short banner (a phone on its side): smaller faces, tighter spacing; keyed on shape, not height, so the height it settles at can't flip it. */
  @media (max-height: 300px) and (min-aspect-ratio: 3/1) {
    main { padding-top: calc(10px + env(safe-area-inset-top)); padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    .question { font-size: 15px; line-height: 1.35; }
    .faces { margin-top: 8px; }
    .face { max-width: 48px; border-radius: 14px; font-size: 24px; }
    .scale { margin-top: 3px; font-size: 11px; line-height: 1.3; }
  }
  /* Shown full screen: centred, not a strip at the top; a transform keeps the measured height. */
  @media (min-height: 320px) {
    body { border-top: 0; }
    main { transform: translateY(max(0px, calc(50vh - 50%))); }
  }
</style>
</head>
<body data-grovs-edit-color="--brand" style="--brand: #1D6FE0">
  <main>
    <div id="ask">
      <p class="question" data-grovs-edit="Question">How are you enjoying the app so far?</p>
      <div class="faces" role="group" aria-label="Your rating">
        <button type="button" class="face" data-grovs-edit="Awful" data-grovs-action="track" data-grovs-event="feedback_awful">😞</button>
        <button type="button" class="face" data-grovs-edit="Bad" data-grovs-action="track" data-grovs-event="feedback_bad">🙁</button>
        <button type="button" class="face" data-grovs-edit="Okay" data-grovs-action="track" data-grovs-event="feedback_okay">😐</button>
        <button type="button" class="face" data-grovs-edit="Good" data-grovs-action="track" data-grovs-event="feedback_good">🙂</button>
        <button type="button" class="face" data-grovs-edit="Great" data-grovs-action="track" data-grovs-event="feedback_great">😍</button>
      </div>
      <div class="scale"><span>Not great</span><span>Love it</span></div>
    </div>
    <div id="done" class="thanks" role="status" hidden>
      <span class="tick" aria-hidden="true"></span>
      <span data-grovs-edit="Thanks">Thanks, that really helps!</span>
    </div>
  </main>
  <script>
    (function () {
      var ask = document.getElementById("ask");
      var done = document.getElementById("done");
      // The tap itself is tracked by data-grovs-action; this only says thanks, then closes.
      ask.addEventListener("click", function (e) {
        var face = e.target.closest(".face");
        if (!face) return;
        face.classList.add("picked");
        // Disabled after this tap, so a second tap records nothing.
        ask.querySelectorAll(".face").forEach(function (other) {
          other.disabled = true;
        });
        setTimeout(function () {
          ask.hidden = true;
          done.hidden = false;
        }, 350);
        setTimeout(function () {
          grovs.close();
        }, 2000);
      });
    })();
  </script>
</body>
</html>
