<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="grovs-layout" content="full">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<title>Feature tour</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FFFFFF;
    --text: #0F172A;
    --muted: #475569;
    --soft: #F1F5F9;
    --surface: #FFFFFF;
    --line: #CBD5E1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B1220; --text: #F1F5F9; --muted: #94A3B8; --soft: #16213A; --surface: #1B2740; --line: #334155; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* At least the screen's height (vh, so a banner measures the content), growing and scrolling when a short frame can't fit it. */
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  .slides {
    flex: 1 0 auto;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .slides::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(56px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-right)) 16px calc(28px + env(safe-area-inset-left));
    scroll-snap-align: start;
    text-align: center;
  }
  .art {
    display: grid;
    place-items: center;
    width: min(280px, 70vw);
    aspect-ratio: 1;
    margin-bottom: 28px;
    border-radius: 36%;
    background: radial-gradient(closest-side, rgba(2, 119, 189, .16), transparent);
    background: radial-gradient(closest-side, color-mix(in srgb, var(--brand) 20%, transparent), transparent);
  }
  .art svg { width: 82%; height: auto; overflow: visible; }
  .fb { fill: var(--brand); }
  .ft { fill: color-mix(in srgb, var(--brand) 22%, var(--surface)); }
  .fs { fill: var(--surface); }
  .fl { fill: var(--line); }
  .sb { stroke: var(--brand); }
  .card { filter: drop-shadow(0 12px 18px rgba(15, 23, 42, .12)); }
  h2 { max-width: 420px; margin: 0 0 8px; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; }
  .slide p { max-width: 400px; margin: 0; color: var(--muted); }
  footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 12px calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 8px; height: 8px; border-radius: 999px; background: var(--line); transition: width .25s ease, background .25s ease; }
  .dots span.on { width: 22px; background: var(--brand); }
  .btn {
    appearance: none;
    min-height: 48px;
    padding: 12px 22px;
    border: 0;
    border-radius: 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.97); }
  .skip { justify-self: start; padding-left: 4px; padding-right: 4px; background: transparent; color: var(--muted); }
  .skip.gone { visibility: hidden; }
  .next, .finish { justify-self: end; background: var(--brand); color: #FFFFFF; box-shadow: 0 8px 20px -10px var(--brand); }
  .next:hover, .finish:hover { filter: brightness(1.06); }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  @media (orientation: landscape) and (max-height: 480px) {
    .slide { padding-top: calc(24px + env(safe-area-inset-top)); }
    .art { width: 140px; margin-bottom: 12px; }
    h2 { font-size: 22px; }
  }
</style>
</head>
<body data-grovs-edit-color="--brand" style="--brand: #0277BD">
  <div class="slides" id="slides">
    <section class="slide" aria-label="1 of 3">
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 240 200">
          <rect class="ft" x="44" y="22" width="152" height="164" rx="18" transform="rotate(-6 120 104)"/>
          <g class="card">
            <rect class="fs" x="40" y="18" width="160" height="164" rx="18"/>
          </g>
          <rect class="fb" x="58" y="36" width="70" height="10" rx="5"/>
          <circle class="fb" cx="68" cy="76" r="10"/>
          <path d="m63 76 4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <rect class="fl" x="88" y="71" width="92" height="10" rx="5"/>
          <circle class="fb" cx="68" cy="110" r="10"/>
          <path d="m63 110 4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <rect class="fl" x="88" y="105" width="72" height="10" rx="5"/>
          <circle class="ft" cx="68" cy="144" r="10"/>
          <rect class="fl" x="88" y="139" width="84" height="10" rx="5"/>
        </svg>
      </div>
      <h2 data-grovs-edit="Slide 1 title">All your plans in one place</h2>
      <p data-grovs-edit="Slide 1 text">Bring tasks, notes and dates together, so nothing slips through the cracks.</p>
    </section>
    <section class="slide" aria-label="2 of 3">
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 240 200">
          <g class="card">
            <rect class="fs" x="96" y="26" width="118" height="62" rx="18"/>
          </g>
          <path class="fs" d="M120 84l-6 16 22-14z"/>
          <rect class="fb" x="112" y="44" width="70" height="9" rx="4.5"/>
          <rect class="fl" x="112" y="61" width="86" height="9" rx="4.5"/>
          <circle class="ft" cx="62" cy="134" r="30"/>
          <circle class="fb" cx="62" cy="126" r="11"/>
          <path class="fb" d="M42 154a20 20 0 0 1 40 0z"/>
          <circle class="fs" cx="120" cy="140" r="36"/>
          <circle class="ft" cx="120" cy="140" r="32"/>
          <circle class="fb" cx="120" cy="131" r="12"/>
          <path class="fb" d="M98 164a22 22 0 0 1 44 0z"/>
          <circle class="ft" cx="178" cy="134" r="30"/>
          <circle class="fb" cx="178" cy="126" r="11"/>
          <path class="fb" d="M158 154a20 20 0 0 1 40 0z"/>
        </svg>
      </div>
      <h2 data-grovs-edit="Slide 2 title">Plan together</h2>
      <p data-grovs-edit="Slide 2 text">Invite friends or teammates, share a list and see changes the moment they happen.</p>
    </section>
    <section class="slide" aria-label="3 of 3">
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 240 200">
          <g class="card">
            <rect class="fs" x="30" y="30" width="180" height="140" rx="18"/>
          </g>
          <rect class="ft" x="54" y="112" width="20" height="38" rx="6"/>
          <rect class="ft" x="86" y="96" width="20" height="54" rx="6"/>
          <rect class="ft" x="118" y="102" width="20" height="48" rx="6"/>
          <rect class="ft" x="150" y="78" width="20" height="72" rx="6"/>
          <path class="sb" d="M50 100 86 82l32 8 54-40" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle class="fb" cx="172" cy="50" r="9"/>
          <circle class="fs" cx="172" cy="50" r="4"/>
          <rect class="fl" x="50" y="44" width="56" height="9" rx="4.5"/>
        </svg>
      </div>
      <h2 data-grovs-edit="Slide 3 title">See your progress</h2>
      <p data-grovs-edit="Slide 3 text">Weekly summaries show what you finished and what is coming up next.</p>
    </section>
  </div>
  <footer>
    <button type="button" class="btn skip" id="skip" data-grovs-edit="Skip button" data-grovs-action="close">Skip</button>
    <div class="dots" id="dots" aria-hidden="true"><span class="on"></span><span></span><span></span></div>
    <button type="button" class="btn next" id="next" data-grovs-edit="Next button">Next</button>
    <button type="button" class="btn finish" id="finish" data-grovs-edit="Finish button" data-grovs-action="close" hidden>Get started</button>
  </footer>
  <script>
    (function () {
      var slides = document.getElementById("slides");
      var dots = document.getElementById("dots").children;
      var skip = document.getElementById("skip");
      var next = document.getElementById("next");
      var finish = document.getElementById("finish");
      var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var count = dots.length;
      function current() {
        return Math.round(slides.scrollLeft / slides.clientWidth);
      }
      function update() {
        var at = current();
        for (var i = 0; i < count; i++) dots[i].className = i === at ? "on" : "";
        var last = at === count - 1;
        next.hidden = last;
        finish.hidden = !last;
        skip.classList.toggle("gone", last);
      }
      next.addEventListener("click", function () {
        slides.scrollTo({ left: (current() + 1) * slides.clientWidth, behavior: still ? "auto" : "smooth" });
      });
      slides.addEventListener("scroll", update, { passive: true });
      window.addEventListener("resize", update);
    })();
  </script>
</body>
</html>
