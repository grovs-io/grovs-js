<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --bg: #FFFFFF; --text: #0F172A; --muted: #475569; --edge: #E2E8F0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B1220; --text: #F1F5F9; --muted: #94A3B8; --edge: #1E293B; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .btn { appearance: none; display: block; width: 100%; min-height: 48px; margin-top: 12px; padding: 12px 20px; border: 0; border-radius: 14px;
    background: #4F46E5; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer; }
  main { padding: 16px 20px 20px; }
  video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; }
</style>
</head>
<body>
  <video id="v" src="https://s3.eu-north-1.amazonaws.com/grovs.io/grovs-test-video.mp4" autoplay muted loop playsinline controls width="960" height="540"></video>
  <main>
    <h1>zz-qa video title</h1>
    <p id="s" data-state="waiting">zz-qa video waiting</p>
    <p id="l">zz-qa loops 0</p>
    <button type="button" class="btn" data-grovs-action="close">zz-qa video done</button>
  </main>
  <script>
    (function () {
      var v = document.getElementById("v");
      var s = document.getElementById("s");
      var l = document.getElementById("l");
      var loops = 0;
      var last = 0;
      function set(state) {
        if (s.getAttribute("data-state") === state) return;
        s.setAttribute("data-state", state);
        s.textContent = "zz-qa video " + state;
      }
      function check() {
        if (!v.paused && v.currentTime > 0 && v.muted) set("playing");
      }
      v.addEventListener("playing", check);
      v.addEventListener("timeupdate", function () {
        check();
        // A loop restarts the clip without an ended event.
        if (v.currentTime + 1 < last) l.textContent = "zz-qa loops " + ++loops;
        last = v.currentTime;
      });
      v.addEventListener("error", function () { set("error"); });
    })();
  </script>
</body>
</html>
