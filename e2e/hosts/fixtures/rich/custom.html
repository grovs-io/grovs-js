<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --bg: #FFFFFF; --text: #0F172A; --muted: #475569; --edge: #E2E8F0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B1220; --text: #F1F5F9; --muted: #94A3B8; --edge: #1E293B; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .btn { appearance: none; display: block; width: 100%; min-height: 48px; margin-top: 12px; padding: 12px 20px; border: 0; border-radius: 14px;
    background: #4F46E5; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer; }
  @font-face { font-family: "ZzQa"; src: url(https://fonts.gstatic.com/s/pacifico/v23/FwZY7-Qmy14u9lezJ-6H6MmBp0u-.woff2) format("woff2"); font-display: block; }
  body { padding: 60px 0 76px; }
  .bar { position: fixed; left: 0; right: 0; z-index: 2; display: flex; align-items: center; padding: 0 56px 0 16px; background: #0F172A; color: #FFFFFF; }
  .bar.top { top: 0; height: 48px; }
  .bar.bottom { bottom: 0; height: 64px; padding-right: 16px; }
  .bar.bottom .btn { margin: 0; min-height: 44px; }
  main { padding: 8px 20px 16px; }
  h1 { margin: 0 0 4px; font: 32px/1.3 "ZzQa", cursive; }
  .spin { width: 32px; height: 32px; border: 4px solid #CBD5E1; border-top-color: #4F46E5; border-radius: 50%; animation: spin .8s linear infinite; }
  .pulse { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #E11D48; color: #FFFFFF; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .5; transform: scale(1.08); } }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input { width: 100%; min-height: 44px; margin-top: 6px; padding: 10px 12px; border: 1px solid #94A3B8; border-radius: 10px; font: inherit; background: var(--bg); color: var(--text); }
</style>
</head>
<body>
  <div class="bar top">zz-qa fixed header</div>
  <main>
    <h1>zz-qa custom font</h1>
    <p id="font">zz-qa font waiting</p>
    <div class="spin" aria-hidden="true"></div>
    <p><span class="pulse">zz-qa animated</span></p>
    <label for="name">zz-qa your name</label>
    <input id="name" type="text" placeholder="zz-qa name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button type="button" class="btn" id="send">zz-qa send</button>
    <p id="echo">zz-qa echo none</p>
  </main>
  <div class="bar bottom"><button type="button" class="btn" data-grovs-action="close">zz-qa fixed close</button></div>
  <script>
    (function () {
      var font = document.getElementById("font");
      document.fonts.load('32px "ZzQa"').then(function (faces) {
        font.textContent = faces.length && document.fonts.check('32px "ZzQa"') ? "zz-qa font loaded" : "zz-qa font missing";
      }, function () {
        font.textContent = "zz-qa font missing";
      });
      var input = document.getElementById("name");
      document.getElementById("send").addEventListener("click", function () {
        document.getElementById("echo").textContent = "zz-qa echo " + input.value;
        grovs.track("zz_qa_rich_form", { length: input.value.length });
        input.blur();
      });
    })();
  </script>
</body>
</html>
