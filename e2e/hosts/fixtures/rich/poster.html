<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --bg: #FFFFFF; --text: #0F172A; --muted: #475569; --edge: #E2E8F0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B1220; --text: #F1F5F9; --muted: #94A3B8; --edge: #1E293B; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .btn { appearance: none; display: block; width: 100%; min-height: 48px; margin-top: 12px; padding: 12px 20px; border: 0; border-radius: 14px;
    background: #4F46E5; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer; }
  main { padding: 16px 20px 20px; }
  video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #333; object-fit: cover; }
</style>
</head>
<body>
  <video id="v" poster="https://fastly.picsum.photos/id/1018/3840/2160.jpg?hmac=b2q_3QwuhhYUuuWX1Y3-SHV9M4aBLTbT-C-U_39NQik" src="https://s3.eu-north-1.amazonaws.com/grovs.io/grovs-test-video.mp4" preload="none" muted playsinline controls width="3840" height="2160"></video>
  <main>
    <h1>zz-qa poster title</h1>
    <p id="s" data-state="waiting">zz-qa poster waiting</p>
    <button type="button" class="btn" data-grovs-action="close">zz-qa poster done</button>
  </main>
  <script>
    (function () {
      var s = document.getElementById("s");
      var image = new Image();
      image.onload = function () {
        s.setAttribute("data-state", "loaded");
        s.textContent = "zz-qa poster loaded " + image.naturalWidth;
      };
      image.onerror = function () {
        s.setAttribute("data-state", "error");
        s.textContent = "zz-qa poster error";
      };
      image.src = document.getElementById("v").getAttribute("poster");
    })();
  </script>
</body>
</html>
